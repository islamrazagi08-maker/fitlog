<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitLog" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <title>FitLog</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & THEMES (100% OFFLINE PURE CSS)
       ========================================================================= */
    :root {
      --bg: #ffffff;
      --bg-elev: #f8fafc;
      --bg-muted: #f1f5f9;
      --bg-input: #f1f5f9;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;
      --text: #0f172a;
      --text-sec: #475569;
      --text-muted: #94a3b8;
      --accent: #0f172a;
      --accent-text: #ffffff;
      --accent-soft: #e2e8f0;
      --done: #10b981;
      --done-soft: rgba(16, 185, 129, 0.12);
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.1);
      --muscle-primary: #f43f5e;
      --muscle-secondary: #fb923c;
      --m-base-1: #cbd5e1;
      --m-base-2: #94a3b8;
      --m-base-3: #64748b;
      --body-sil-1: #f1f5f9;
      --body-sil-2: #cbd5e1;
      --body-sil-3: #94a3b8;
      --body-outline: #64748b;
      --body-bg: #f1f5f9;
      --scene-bg-1: #f8fafc;
      --scene-bg-2: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html.dark {
      --bg: #09090b;
      --bg-elev: #121215;
      --bg-muted: #18181b;
      --bg-input: #18181b;
      --border: #27272a;
      --border-soft: #1c1c20;
      --text: #fafafa;
      --text-sec: #a1a1aa;
      --text-muted: #71717a;
      --accent: #fafafa;
      --accent-text: #09090b;
      --accent-soft: #27272a;
      --done: #10b981;
      --done-soft: rgba(16, 185, 129, 0.15);
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.14);
      --muscle-primary: #f43f5e;
      --muscle-secondary: #fb923c;
      --m-base-1: #52525b;
      --m-base-2: #3f3f46;
      --m-base-3: #27272a;
      --body-sil-1: #3f3f46;
      --body-sil-2: #27272a;
      --body-sil-3: #18181b;
      --body-outline: #52525b;
      --body-bg: #18181b;
      --scene-bg-1: #18181b;
      --scene-bg-2: #09090b;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      min-height: 100vh;
      padding-top: var(--safe-top);
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* =========================================================================
       2. LAYOUT & HEADER & BOTTOM NAV
       ========================================================================= */
    .app-shell {
      max-width: 576px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sec);
      transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }
    .icon-btn:hover { background: var(--bg-muted); color: var(--text); }
    .icon-btn:active { transform: scale(0.92); }

    .main-content {
      flex: 1;
      padding: 6px 16px calc(92px + var(--safe-bottom));
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    .bottom-nav-inner {
      max-width: 576px;
      margin: 0 auto;
      height: 58px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0 16px;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.15s ease;
    }
    .nav-tab.active {
      color: var(--text);
      font-weight: 600;
    }

    /* =========================================================================
       3. SEGMENTED CONTROL & WORKOUT LIST (ACCORDION)
       ========================================================================= */
    .day-switcher {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--bg-muted);
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-switcher::-webkit-scrollbar { display: none; }

    .day-pill {
      flex: 1;
      min-width: 48px;
      height: 36px;
      padding: 0 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .day-pill.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .day-head {
      padding: 0 2px 14px;
    }
    .day-head-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .day-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .schedule-chip {
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--bg-muted);
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .schedule-chip:hover { color: var(--text); background: var(--accent-soft); }
    .day-sub {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .day-note {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--text-sec);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .ex-list {
      border-top: 1px solid var(--border-soft);
    }

    .ex-item {
      border-bottom: 1px solid var(--border-soft);
    }

    .ex-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 2px;
    }

    .ex-row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .ex-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .ex-ring svg { display: block; }
    .ex-ring-text {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sec);
    }

    .ex-info {
      flex: 1;
      min-width: 0;
    }
    .ex-name {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.32;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ex-item.all-done .ex-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .ex-meta {
      margin-top: 2px;
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prog-pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      margin-left: 4px;
      border-radius: 999px;
      background: var(--done-soft);
      color: var(--done);
      font-size: 10.5px;
      font-weight: 700;
      vertical-align: middle;
    }

    .tech-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sec);
      background: var(--bg-muted);
      transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }
    .tech-icon-btn:hover { color: var(--text); background: var(--accent-soft); }
    .tech-icon-btn:active { transform: scale(0.92); }

    /* Раскрытый аккордеон */
    .ex-body {
      padding: 2px 2px 16px 40px;
      animation: fadeIn 0.18s ease;
    }

    .coach-tip {
      margin-bottom: 12px;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.35;
    }
    .coach-tip.up {
      background: var(--done-soft);
      border-color: color-mix(in srgb, var(--done) 30%, transparent);
      color: var(--text);
    }
    .coach-tip strong { color: var(--text); font-weight: 600; }
    .coach-tip.up strong { color: var(--done); }
    .apply-w-btn {
      height: 30px;
      padding: 0 10px;
      border-radius: 9px;
      background: var(--done);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .apply-w-btn:active { transform: scale(0.94); }

    .weekday-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .weekday-btn {
      height: 38px;
      border-radius: 10px;
      background: var(--bg-muted);
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 600;
    }
    .weekday-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .report-area {
      width: 100%;
      min-height: 220px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }

    .sets-header {
      display: grid;
      grid-template-columns: 20px 1fr 1fr 44px;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .sets-header span:first-child,
    .sets-header span:last-child { text-align: center; }

    .set-row {
      display: grid;
      grid-template-columns: 20px 1fr 1fr 44px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-num {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .set-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--bg-input);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .set-input::placeholder { color: var(--text-muted); font-weight: 400; }
    .set-input:focus {
      border-color: var(--text);
      background: var(--bg);
    }
    .set-row.done .set-input {
      background: var(--done-soft);
      color: var(--done);
    }

    .check-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-muted);
      color: var(--text-muted);
      transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }
    .check-btn:active { transform: scale(0.88); }
    .set-row.done .check-btn {
      background: var(--done);
      color: #ffffff;
    }

    .ex-body-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .text-link-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      padding: 6px 2px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }
    .text-link-btn:hover { color: var(--text); }

    .finish-wrap {
      margin-top: 22px;
    }

    .primary-btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .primary-btn:active { transform: scale(0.98); opacity: 0.9; }

    .secondary-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--bg-muted);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .secondary-btn:active { transform: scale(0.96); }

    /* =========================================================================
       4. SMART FLOATING REST TIMER
       ========================================================================= */
    .timer-float {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(68px + var(--safe-bottom));
      z-index: 35;
      pointer-events: none;
    }

    .timer-card {
      max-width: 552px;
      margin: 0 auto;
      pointer-events: auto;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .timer-progress-track {
      height: 3px;
      width: 100%;
      background: color-mix(in srgb, var(--accent-text) 16%, transparent);
    }
    .timer-progress-fill {
      height: 100%;
      background: var(--done);
      transition: width 0.2s linear;
    }

    .timer-top {
      padding: 12px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .timer-time {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .timer-name {
      font-size: 11.5px;
      opacity: 0.72;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .timer-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-chip {
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent-text) 14%, transparent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .timer-chip:active { transform: scale(0.93); }
    .timer-chip.stop {
      background: rgba(244, 63, 94, 0.9);
      color: #ffffff;
    }

    .timer-presets {
      padding: 0 14px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .timer-preset-btn {
      flex: 1;
      height: 28px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent-text) 10%, transparent);
      color: var(--accent-text);
      font-size: 11.5px;
      font-weight: 600;
      opacity: 0.85;
    }
    .timer-preset-btn:active { opacity: 1; transform: scale(0.96); }

    /* =========================================================================
       5. PROGRESS TAB (NUTRITION, INBODY, CARDIO)
       ========================================================================= */
    .section-block {
      margin-bottom: 26px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .goal-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .goal-big {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .goal-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .bar-track {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      margin: 10px 0 14px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--done);
      transition: width 0.3s ease;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .macro-lbl { font-size: 11px; color: var(--text-muted); }
    .macro-val { font-size: 12.5px; font-weight: 600; margin-top: 2px; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (min-width: 460px) {
      .metrics-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .metric-box {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .metric-lbl { font-size: 11px; color: var(--text-muted); }
    .metric-val { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .metric-delta { font-size: 11.5px; font-weight: 600; margin-top: 2px; }
    .delta-good { color: var(--done); }
    .delta-neutral { color: var(--text-muted); }

    .chart-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 11.5px;
      color: var(--text-sec);
      margin-bottom: 8px;
    }
    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .simple-list {
      border-top: 1px solid var(--border-soft);
    }
    .simple-row {
      padding: 12px 2px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .simple-row-title { font-size: 13.5px; font-weight: 600; }
    .simple-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
    .del-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .del-btn:hover { color: var(--danger); background: var(--danger-soft); }

    /* =========================================================================
       6. BOTTOM SHEET / MODAL & ANATOMY / 2-PHASE ILLUSTRATIONS
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.16s ease;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      background: var(--bg);
      border-radius: 24px 24px 0 0;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 640px) {
      .sheet { border-radius: 22px; }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 99px;
      background: var(--border);
      margin: 10px auto 2px;
      flex-shrink: 0;
    }
    @media (min-width: 640px) { .sheet-handle { display: none; } }

    .sheet-head {
      padding: 14px 18px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
    }
    .sheet-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }

    .sheet-body {
      padding: 16px 18px calc(20px + var(--safe-bottom));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Анатомическая карта мышц (Студийный атлас) */
    .anatomy-box {
      background: radial-gradient(circle at 50% 30%, var(--bg-elev) 0%, var(--bg-muted) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 10px 14px;
    }
    .anatomy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      align-items: center;
    }
    .anatomy-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .anatomy-col svg {
      width: 100%;
      max-width: 196px;
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.14));
    }
    .anatomy-caption {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .muscle-legend {
      margin-top: 12px;
      padding: 10px 6px 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12.5px;
    }
    .legend-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .legend-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      transform: translateY(1px);
    }
    .legend-swatch.primary { background: var(--muscle-primary); box-shadow: 0 0 8px rgba(244, 63, 94, 0.6); }
    .legend-swatch.secondary { background: var(--muscle-secondary); }
    .legend-key { color: var(--text-muted); font-weight: 500; }
    .legend-val { color: var(--text); font-weight: 600; }

    /* 2 фазы движения */
    .phases-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .phase-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phase-visual {
      aspect-ratio: 4 / 3;
      width: 100%;
      background: var(--body-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .phase-visual svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .phase-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .phase-label {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sec);
      text-align: center;
      border-top: 1px solid var(--border-soft);
    }

    /* Мини-инструкция */
    .cues-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cues-list li {
      font-size: 13.5px;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }
    .cue-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muscle-primary);
      margin-top: 7px;
      flex-shrink: 0;
    }

    .photo-tools {
      padding-top: 10px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .subtle-btn {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--bg-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .subtle-btn:hover { color: var(--text); }

    /* Формы в модалках */
    .form-stack { display: flex; flex-direction: column; gap: 12px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .field-lbl {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .field-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .field-input:focus { border-color: var(--text); background: var(--bg); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .toggle-row input { width: 18px; height: 18px; accent-color: var(--done); }

    .seg-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--bg-muted);
    }
    .seg-3 button {
      height: 36px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sec);
    }
    .seg-3 button.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Toast */
    .toast-root {
      position: fixed;
      bottom: calc(74px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: 90%;
      max-width: 340px;
    }
    .toast {
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sheetUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

    <!-- Контент -->
    <main id="main-content" class="main-content"></main>

    <!-- Плавающий умный таймер отдыха -->
    <div id="timer-float" class="timer-float hidden">
      <div class="timer-card">
        <div class="timer-progress-track">
          <div id="timer-progress-fill" class="timer-progress-fill" style="width: 100%"></div>
        </div>
        <div class="timer-top">
          <div>
            <div id="timer-display" class="timer-time tabular">01:30</div>
            <div id="timer-label" class="timer-name">Отдых</div>
          </div>
          <div class="timer-controls">
            <button class="timer-chip" onclick="adjustTimer(-15)">−15с</button>
            <button class="timer-chip" onclick="adjustTimer(15)">+15с</button>
            <button class="timer-chip stop" onclick="stopTimer()">Стоп</button>
          </div>
        </div>
        <div class="timer-presets">
          <button class="timer-preset-btn" onclick="startTimer(60, 'Отдых 60с')">60с</button>
          <button class="timer-preset-btn" onclick="startTimer(90, 'Отдых 90с')">90с</button>
          <button class="timer-preset-btn" onclick="startTimer(120, 'Отдых 120с')">120с</button>
        </div>
      </div>
    </div>

    <!-- Нижняя панель из 2 вкладок -->
    <nav class="bottom-nav">
      <div id="bottom-nav" class="bottom-nav-inner"></div>
    </nav>
  </div>

  <!-- Модалка / Шторка -->
  <div id="modal-root" class="modal-backdrop hidden"></div>

  <!-- Toast -->
  <div id="toast-root" class="toast-root"></div>

  <script>
    /* =========================================================================
       1. СЛОВАРЬ МЫШЦ И СТАРТОВЫЕ ДАННЫЕ ПРОГРАММЫ
       ========================================================================= */
    const STORAGE_KEY = 'fitlog_minimal_v3';

    function getCleanUserState() {
      const base = getDefaultState();
      base.days.forEach((d, idx) => {
        d.short = `Д${idx + 1}`;
        d.note = idx === 3 ? 'Дополнительный день: можно переименовать или удалить в настройках.' : '';
      });
      base.nutrition = {
        calories: '2200 ккал',
        protein: '150 г',
        fat: '70 г',
        carbs: '240 г',
        targetWeight: 75.0
      };
      base.inbody = [];
      base.history = [];
      base.cardio = [];
      base.customPhotos = {};
      return base;
    }

    let state = loadState();
    let expandedExId = null;

    function loadState() {
      try {
        const params = new URLSearchParams(window.location.search);
        const isCleanLink = params.get('new') === '1';
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          if (isCleanLink) {
            try { window.history.replaceState({}, '', window.location.pathname); } catch {}
            return getCleanUserState();
          }
          return getDefaultState();
        }
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.days)) return isCleanLink ? getCleanUserState() : getDefaultState();
        if (!parsed.customPhotos) parsed.customPhotos = {};
        return parsed;
      } catch {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Память браузера заполнена — попробуйте удалить лишние фото');
      }
    }

    /* =========================================================================
       2. УТИЛИТЫ (ЭКРАНИРОВАНИЕ, ДАТЫ, TOAST, ТЕМЫ ОФОРМЛЕНИЯ)
       ========================================================================= */
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const parts = String(iso).split('T')[0].split('-');
      return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : iso;
    }

    function showToast(msg) {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function copyTextToClipboard(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch {}
      ta.remove();
      return ok;
    }

    /* =========================================================================
       2.1 МЕХАНИКА ПРОГРЕССИИ НАГРУЗОК (ДВОЙНАЯ ПРОГРЕССИЯ + 1ПМ)
       ========================================================================= */
    function parseRepRange(targetReps) {
      if (!targetReps) return null;
      const str = String(targetReps).toLowerCase();
      if (str.includes('мин') || str.includes('сек')) return null;
      const nums = str.match(/\d+/g);
      if (!nums || !nums.length) return null;
      const min = Number(nums[0]);
      const max = nums.length >= 2 ? Number(nums[1]) : min;
      return (min > 0 && max >= min) ? { min, max } : null;
    }

    function parseNum(val) {
      if (val === null || val === undefined || val === '') return NaN;
      return Number(String(val).replace(',', '.').trim());
    }

    function calc1RM(weight, reps) {
      if (!weight || weight <= 0 || !reps || reps <= 0) return 0;
      if (reps === 1) return Math.round(weight);
      return Math.round(weight * (1 + reps / 30));
    }

    function getProgressionAdvice(ex) {
      const range = parseRepRange(ex.targetReps);
      if (!range) return null;
      const prev = getLastResult(ex.id);
      if (!prev || !prev.length) {
        return {
          type: 'start',
          text: `Подбери вес на <strong>${esc(ex.targetReps)} повт.</strong> с запасом 1–2 повторения.`,
          nextWeight: null,
          best1RM: 0
        };
      }

      const validSets = prev
        .map(s => ({ w: parseNum(s.weight), r: parseNum(s.reps) }))
        .filter(s => !isNaN(s.r) && s.r > 0);

      if (!validSets.length) return null;

      const weighted = validSets.filter(s => !isNaN(s.w) && s.w > 0);
      const topW = weighted.length ? Math.max(...weighted.map(s => s.w)) : 0;
      const best1RM = weighted.length ? Math.max(...weighted.map(s => calc1RM(s.w, s.r))) : 0;
      const minDoneReps = Math.min(...validSets.map(s => s.r));

      // Шаг прибавки: +2.5 кг для весов >= 20 кг, +1 кг для мелких гантелей/изоляции
      const step = topW >= 20 ? 2.5 : 1;

      if (topW > 0 && validSets.length >= Math.max(1, ex.targetSets - 1) && minDoneReps >= range.max) {
        const nextW = +(topW + step).toFixed(1);
        return {
          type: 'up',
          text: `<strong>Пора усилить вес!</strong> Прошлый раз все подходы ≥ ${range.max} повт. Пробуй <strong>${nextW} кг</strong> на ${range.min} повт.`,
          nextWeight: nextW,
          best1RM
        };
      }

      if (topW > 0 && minDoneReps >= range.min) {
        const targetNext = Math.min(range.max, minDoneReps + 1);
        return {
          type: 'reps',
          text: `Оставь <strong>${topW} кг</strong> и постарайся сделать <strong>${targetNext} повт.</strong>${best1RM ? ` · 1ПМ ~${best1RM} кг` : ''}`,
          nextWeight: topW,
          best1RM
        };
      }

      if (topW > 0) {
        return {
          type: 'hold',
          text: `Закрепи <strong>${topW} кг</strong> до уверенных ${range.min} повт. во всех подходах.`,
          nextWeight: topW,
          best1RM
        };
      }

      return null;
    }

    function applySuggestedWeight(dayId, exId, weight) {
      const ex = state.days.find(d => d.id === dayId)?.exercises.find(e => e.id === exId);
      if (!ex) return;
      ex.sets.forEach(s => {
        if (!s.done) s.weight = String(weight);
      });
      saveState();
      renderMain();
      showToast(`Вес ${weight} кг подставлен в подходы`);
    }

    const darkMedia = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme() {
      const mode = (state.settings && state.settings.theme) || 'system';
      const isDark = mode === 'dark' || (mode === 'system' && darkMedia.matches);
      document.documentElement.classList.toggle('dark', isDark);
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', isDark ? '#09090b' : '#ffffff');
      }
    }

    darkMedia.addEventListener('change', () => {
      if (state.settings && state.settings.theme === 'system') {
        applyTheme();
      }
    });

    function renderPhaseSVGs(type) {
      const uidSuf = Math.random().toString(36).slice(2, 6);
      const G = {

        arr: `sAr_${uidSuf}`

      const defs = `
        <defs>
          <linearGradient id="${G.bg}" x1="0" y1="0" x2="0" y2="1">

      // Скульптурный сегмент конечности с мышечным брюшком и тонким бликом
      const limb = (x1, y1, x2, y2, r1, r2, fill, bulge = 2.0) => {
        const dx = x2 - x1, dy = y2 - y1;
        const L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L, ny = dx / L;
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const rm = (r1 + r2) / 2;
        const p1x = x1 + nx * r1, p1y = y1 + ny * r1;
        const p2x = x2 + nx * r2, p2y = y2 + ny * r2;
        const p3x = x2 - nx * r2, p3y = y2 - ny * r2;
        const p4x = x1 - nx * r1, p4y = y1 - ny * r1;
        const c1x = mx + nx * (rm + bulge), c1y = my + ny * (rm + bulge);
        const c2x = mx - nx * (rm + bulge * 0.4), c2y = my - ny * (rm + bulge * 0.4);

        `;

        const dx = hx - sx, dy = hy - sy;

    /* =========================================================================

       ========================================================================= */
    function openTechniqueSheet(dayId, exId) {
      const ex = state.days.find(d => d.id === dayId)?.exercises.find(e => e.id === exId);
      if (!ex) return;

      const primary = ex.primary || [];
      const secondary = ex.secondary || [];
      const { frontSVG, backSVG } = renderAnatomySVG(primary, secondary);
      const [svg1, svg2] = renderPhaseSVGs(ex.diagram || 'lat_pulldown');
      const photos = state.customPhotos[ex.id] || {};

      const primText = primary.length ? primary.map(m => MUSCLE_NAMES[m] || m).join(', ') : 'Общая нагрузка';
      const secText = secondary.length ? secondary.map(m => MUSCLE_NAMES[m] || m).join(', ') : '';
      const cues = (ex.cues && ex.cues.length) ? ex.cues : ['Работайте подконтрольно в полную амплитуду.', 'Следите за ровным дыханием на усилии.'];

      openModal(`
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h3 class="sheet-title">${esc(ex.name)}</h3>
          <button class="icon-btn" style="width:32px;height:32px;" onclick="closeModal()" aria-label="Закрыть">✕</button>
        </div>
        <div class="sheet-body">
          <!-- 1. Анатомическая карта мышц -->
          <div class="anatomy-box">
            <div class="anatomy-grid">
              <div class="anatomy-col">
                ${frontSVG}
                <span class="anatomy-caption">Спереди</span>
              </div>
              <div class="anatomy-col">
                ${backSVG}
                <span class="anatomy-caption">Со спины</span>
              </div>
            </div>
            <div class="muscle-legend">
              <div class="legend-line">
                <span class="legend-swatch primary"></span>
                <div><span class="legend-key">Основная:</span> <span class="legend-val">${esc(primText)}</span></div>
              </div>
              ${secText ? `
                <div class="legend-line">
                  <span class="legend-swatch secondary"></span>
                  <div><span class="legend-key">Доп.:</span> <span class="legend-val">${esc(secText)}</span></div>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- 2. Мини-инструкция с двумя картинками -->
          <div class="phases-grid">
            <div class="phase-card">
              <div class="phase-visual">
                ${photos.p1 ? `<img src="${photos.p1}" alt="Старт" />` : svg1}
              </div>
              <div class="phase-label">1. Старт</div>
            </div>
            <div class="phase-card">
              <div class="phase-visual">
                ${photos.p2 ? `<img src="${photos.p2}" alt="Финиш" />` : svg2}
              </div>
              <div class="phase-label">2. Финиш / Пик</div>
            </div>
          </div>

          <!-- 3. Короткие пункты техники -->
          <ul class="cues-list">
            ${cues.map(c => `<li><span class="cue-dot"></span><span>${esc(c)}</span></li>`).join('')}
          </ul>

          <!-- 4. Загрузка своих фото -->
          <div class="photo-tools">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <label class="subtle-btn">
                📷 Заменить фото 1
                <input type="file" accept="image/*" style="display:none" onchange="handleCustomPhoto(event, '${dayId}', '${ex.id}', 'p1')" />
              </label>
              <label class="subtle-btn">
                📷 Заменить фото 2
                <input type="file" accept="image/*" style="display:none" onchange="handleCustomPhoto(event, '${dayId}', '${ex.id}', 'p2')" />
              </label>
            </div>
            ${(photos.p1 || photos.p2) ? `
              <button class="subtle-btn" onclick="resetCustomPhotos('${dayId}', '${ex.id}')">Сбросить фото</button>
            ` : ''}
          </div>
        </div>
      `);
    }

    function handleCustomPhoto(event, dayId, exId, slot) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 480;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressed = canvas.toDataURL('image/jpeg', 0.72);
          if (!state.customPhotos[exId]) state.customPhotos[exId] = {};
          state.customPhotos[exId][slot] = compressed;
          saveState();
          openTechniqueSheet(dayId, exId);
          showToast('Фото сохранено');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetCustomPhotos(dayId, exId) {
      delete state.customPhotos[exId];
      saveState();
      openTechniqueSheet(dayId, exId);
      showToast('Стандартная схема возвращена');
    }

    /* =========================================================================
       6. УМНЫЙ ТАЙМЕР ОТДЫХА (WEB AUDIO + VIBRATE)
       ========================================================================= */
    const timer = { running: false, total: 90, left: 90, end: 0, iv: null, label: 'Отдых' };

    function playFinishSignal() {
      try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch {}
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        [0, 0.24].forEach((offset, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(i === 0 ? 880 : 1046.5, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 0.24);
        });
      } catch {}
    }

    function fmtSec(sec) {
      const s = Math.max(0, Math.ceil(sec));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function renderTimerUI() {
      const box = document.getElementById('timer-float');
      if (!timer.running) {
        box.classList.add('hidden');
        return;
      }
      box.classList.remove('hidden');
      document.getElementById('timer-display').textContent = fmtSec(timer.left);
      document.getElementById('timer-label').textContent = timer.label;
      const pct = timer.total > 0 ? Math.max(0, Math.min(100, (timer.left / timer.total) * 100)) : 0;
      document.getElementById('timer-progress-fill').style.width = `${pct}%`;
    }

    function startTimer(sec, label = 'Отдых') {
      clearInterval(timer.iv);
      timer.running = true;
      timer.total = sec;
      timer.left = sec;
      timer.label = label;
      timer.end = Date.now() + sec * 1000;
      renderTimerUI();
      timer.iv = setInterval(() => {
        const diff = (timer.end - Date.now()) / 1000;
        if (diff <= 0) {
          stopTimer();
          playFinishSignal();
          showToast('Отдых завершён — к подходу');
        } else {
          timer.left = diff;
          renderTimerUI();
        }
      }, 200);
    }

    function adjustTimer(delta) {
      if (!timer.running) return;
      const next = Math.max(5, timer.left + delta);
      timer.total = Math.max(timer.total, next);
      timer.left = next;
      timer.end = Date.now() + next * 1000;
      renderTimerUI();
    }

    function stopTimer() {
      clearInterval(timer.iv);
      timer.iv = null;
      timer.running = false;
      renderTimerUI();
    }

    function openManualTimer() {
      if (timer.running) stopTimer();
      else startTimer(90, 'Отдых 90с');
    }

    /* =========================================================================
       7. НАВИГАЦИЯ И ОСНОВНОЙ РЕНДЕР (ТРЕНИРОВКА + ПРОГРЕСС)
       ========================================================================= */
    function setTab(tab) {
      state.activeTab = tab;
      saveState();
      renderNav();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderNav() {
      const nav = document.getElementById('bottom-nav');
      nav.innerHTML = `
        <button class="nav-tab ${state.activeTab === 'workout' ? 'active' : ''}" onclick="setTab('workout')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5h11M6.5 17.5h11M4 10v4M20 10v4M7 4v16M17 4v16"/>
          </svg>
          <span>Тренировка</span>
        </button>
        <button class="nav-tab ${state.activeTab === 'progress' ? 'active' : ''}" onclick="setTab('progress')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
          </svg>
          <span>Прогресс</span>
        </button>
      `;
    }

    function selectDay(dayId) {
      state.activeDayId = dayId;
      expandedExId = null;
      saveState();
      renderMain();
    }

    function getLastResult(exId) {
      for (let i = state.history.length - 1; i >= 0; i--) {
        const s = state.history[i];
        if (s.exercises && s.exercises[exId] && s.exercises[exId].length) return s.exercises[exId];
      }
      return null;
    }

    function renderMain() {
      const root = document.getElementById('main-content');
      if (state.activeTab === 'progress') renderProgressTab(root);
      else renderWorkoutTab(root);
    }

    function renderWorkoutTab(container) {
      const day = state.days.find(d => d.id === state.activeDayId) || state.days[0];
      if (day && state.activeDayId !== day.id) state.activeDayId = day.id;

      container.innerHTML = `
        <div class="day-switcher">
          ${state.days.map(d => `
            <button class="day-pill ${d.id === day.id ? 'active' : ''}" onclick="selectDay('${d.id}')">${esc(d.short)}</button>
          `).join('')}
        </div>

        <div class="day-head">
          <div class="day-head-row">
            <h2 class="day-title">${esc(day.title)}</h2>
            <button class="schedule-chip" onclick="openDayScheduleModal('${day.id}')" title="Изменить день недели">
              <span>${esc(day.short)}</span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
          </div>
          ${day.note ? `<p class="day-note">${esc(day.note)}</p>` : ''}
        </div>

        <div class="ex-list">
          ${day.exercises.map(ex => renderExerciseItem(day, ex)).join('')}
        </div>

        <div class="finish-wrap">
          <button class="primary-btn" onclick="finishWorkout('${day.id}')">Завершить и сохранить тренировку</button>
        </div>
      `;
    }

    function renderExerciseItem(day, ex) {
      const isOpen = expandedExId === ex.id;
      const doneCount = ex.sets.filter(s => s.done).length;
      const total = ex.sets.length;
      const allDone = total > 0 && doneCount === total;
      const prev = getLastResult(ex.id);
      const prevShort = prev ? prev.map(s => (s.weight ? `${s.weight}×${s.reps || '—'}` : `${s.reps || '—'}`)).join(', ') : '';
      const advice = getProgressionAdvice(ex);

      const r = 11;
      const circ = 2 * Math.PI * r;
      const offset = total > 0 ? circ * (1 - doneCount / total) : circ;

      const ringHTML = allDone
        ? `<div class="ex-ring" style="background:var(--done);color:#fff;">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
           </div>`
        : `<div class="ex-ring">
             <svg width="28" height="28" viewBox="0 0 28 28">
               <circle cx="14" cy="14" r="${r}" fill="none" stroke="var(--border)" stroke-width="2.5"/>
               <circle cx="14" cy="14" r="${r}" fill="none" stroke="var(--done)" stroke-width="2.5" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 14 14)" stroke-linecap="round"/>
             </svg>
             <span class="ex-ring-text tabular">${doneCount}</span>
           </div>`;

      const metaLine = `${ex.targetSets}×${ex.targetReps}` + (prevShort ? ` · прошлый: ${prevShort}` : (ex.restSec > 0 ? ` · отдых ${ex.restSec}с` : ''));
      const upPill = advice && advice.type === 'up' ? `<span class="prog-pill">↑ ${advice.nextWeight} кг</span>` : '';

      return `
        <div id="ex-${ex.id}" class="ex-item ${allDone ? 'all-done' : ''}">
          <div class="ex-row">
            <button class="ex-row-main" onclick="toggleAccordion('${ex.id}')">
              ${ringHTML}
              <div class="ex-info">
                <div class="ex-name">${esc(ex.name)}</div>
                <div class="ex-meta tabular">${esc(metaLine)}${upPill}</div>
              </div>
            </button>
            <button class="tech-icon-btn" onclick="openTechniqueSheet('${day.id}', '${ex.id}')" title="Техника и мышцы" aria-label="Техника и мышцы">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 4.5C9.5 3.5 14.5 3.5 16 4.5L19.5 7.5L17.5 11.5L15.5 10.5L15 20H9L8.5 10.5L6.5 11.5L4.5 7.5L8 4.5Z"/>
                <path d="M12 8.5V16M9.5 11.5H14.5"/>
              </svg>
            </button>
          </div>

          ${isOpen ? `
            <div class="ex-body">
              ${advice ? `
                <div class="coach-tip ${advice.type === 'up' ? 'up' : ''}">
                  <div>${advice.text}</div>
                  ${advice.type === 'up' && advice.nextWeight ? `
                    <button class="apply-w-btn" onclick="applySuggestedWeight('${day.id}', '${ex.id}', ${advice.nextWeight})">Взять ${advice.nextWeight}</button>
                  ` : ''}
                </div>
              ` : ''}
              <div class="sets-header">
                <span>№</span><span>Вес (кг)</span><span>Повт</span><span>Ок</span>
              </div>
              ${ex.sets.map((s, idx) => {
                const prevSet = prev && prev[idx] ? prev[idx] : null;
                return `
                  <div class="set-row ${s.done ? 'done' : ''}">
                    <span class="set-num tabular">${idx + 1}</span>
                    <input class="set-input tabular" type="text" inputmode="decimal" value="${esc(s.weight)}" placeholder="${prevSet && prevSet.weight ? esc(prevSet.weight) : '0'}" oninput="setField('${day.id}', '${ex.id}', '${s.id}', 'weight', this.value)" />
                    <input class="set-input tabular" type="text" inputmode="decimal" value="${esc(s.reps)}" placeholder="${prevSet && prevSet.reps ? esc(prevSet.reps) : esc(ex.targetReps)}" oninput="setField('${day.id}', '${ex.id}', '${s.id}', 'reps', this.value)" />
                    <button class="check-btn" onclick="toggleSet('${day.id}', '${ex.id}', '${s.id}')" aria-label="Отметить подход">
                      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                  </div>
                `;
              }).join('')}
              <div class="ex-body-footer">
                <button class="text-link-btn" onclick="addSet('${day.id}', '${ex.id}')">+ подход</button>
                <button class="text-link-btn" onclick="openTechniqueSheet('${day.id}', '${ex.id}')">Мышцы и техника →</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function toggleAccordion(exId) {
      expandedExId = expandedExId === exId ? null : exId;
      renderMain();
    }

    function setField(dayId, exId, setId, key, val) {
      const s = state.days.find(d => d.id === dayId)?.exercises.find(e => e.id === exId)?.sets.find(x => x.id === setId);
      if (!s) return;
      s[key] = val;
      saveState();
    }

    function toggleSet(dayId, exId, setId) {
      const day = state.days.find(d => d.id === dayId);
      const ex = day?.exercises.find(e => e.id === exId);
      const s = ex?.sets.find(x => x.id === setId);
      if (!s) return;

      s.done = !s.done;

      if (s.done && !s.weight && !s.reps) {
        const prev = getLastResult(exId);
        const idx = ex.sets.findIndex(x => x.id === setId);
        if (prev && prev[idx]) {
          if (!s.weight && prev[idx].weight) s.weight = prev[idx].weight;
          if (!s.reps && prev[idx].reps) s.reps = prev[idx].reps;
        }
      }

      saveState();

      if (s.done && ex.restSec > 0 && state.settings.autoTimer) {
        startTimer(ex.restSec, ex.name);
      }

      const node = document.getElementById(`ex-${ex.id}`);
      if (node) {
        const wrap = document.createElement('div');
        wrap.innerHTML = renderExerciseItem(day, ex);
        node.replaceWith(wrap.firstElementChild);
      }
    }

    function addSet(dayId, exId) {
      const ex = state.days.find(d => d.id === dayId)?.exercises.find(e => e.id === exId);
      if (!ex) return;
      const last = ex.sets[ex.sets.length - 1];
      ex.sets.push({ id: uid('s'), weight: last ? last.weight : '', reps: last ? last.reps : '', done: false });
      saveState();
      renderMain();
    }

    function finishWorkout(dayId) {
      const day = state.days.find(d => d.id === dayId);
      if (!day) return;

      const recorded = {};
      let count = 0;
      day.exercises.forEach(ex => {
        const doneSets = ex.sets.filter(s => s.done).map(s => ({ weight: s.weight.trim(), reps: s.reps.trim() }));
        if (doneSets.length) {
          recorded[ex.id] = doneSets;
          count += doneSets.length;
        }
      });

      if (count === 0) {
        showToast('Отметьте хотя бы один подход');
        return;
      }

      state.history.push({ id: uid('h'), dayId: day.id, date: todayISO(), exercises: recorded });
      day.exercises.forEach(ex => ex.sets.forEach(s => { s.done = false; s.weight = ''; s.reps = ''; }));
      expandedExId = null;
      saveState();
      renderMain();
      showToast(`Тренировка сохранена (${count} подх.)`);
    }

    /* =========================================================================
       8. ВКЛАДКА «ПРОГРЕСС» (КБЖУ, INBODY, КАРДИО)
       ========================================================================= */
    function renderProgressTab(container) {
      const sorted = [...state.inbody].sort((a, b) => a.date.localeCompare(b.date));
      const first = sorted[0] || null;
      const latest = sorted[sorted.length - 1] || null;
      const nut = state.nutrition;

      let pctGoal = 0;
      let leftText = '';
      if (first && latest && nut.targetWeight) {
        const totalDrop = Math.max(0.1, first.weight - nut.targetWeight);
        const doneDrop = Math.max(0, first.weight - latest.weight);
        pctGoal = Math.min(100, Math.max(4, Math.round((doneDrop / totalDrop) * 100)));
        const rem = +(latest.weight - nut.targetWeight).toFixed(1);
        leftText = rem > 0 ? `осталось −${rem} кг` : 'цель достигнута';
      }

      const deltaHtml = (now, start, unit, goodDown = true) => {
        if (!first || !latest || first.id === latest.id) return `<div class="metric-delta delta-neutral">база</div>`;
        const d = +(now - start).toFixed(1);
        const sign = d > 0 ? '+' : '';
        const isGood = goodDown ? d < 0 : d > 0;
        return `<div class="metric-delta tabular ${isGood ? 'delta-good' : 'delta-neutral'}">${sign}${d}${unit}</div>`;
      };

      container.innerHTML = `
        <section class="section-block">
          <div class="section-head">
            <h2 class="section-title">Отчёт для AI-тренера</h2>
            <span class="goal-sub">Раз в месяц</span>
          </div>
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <div>
              <div style="font-size:14px;font-weight:600;">Экспорт прогресса для чата</div>
              <div class="goal-sub" style="margin-top:2px;">Силовые, InBody, кардио и КБЖУ в 1 клик</div>
            </div>
            <button class="primary-btn" style="width:auto;height:40px;padding:0 14px;font-size:13px;flex-shrink:0;" onclick="openAICoachReportModal(30)">Собрать отчёт</button>
          </div>
        </section>

        <section class="section-block">
          <div class="section-head">
            <h2 class="section-title">Цель и питание</h2>
            <button class="text-link-btn" onclick="openNutritionModal()">Изменить</button>
          </div>
          <div class="card">
            <div class="goal-row">
              <div>
                <div class="goal-big tabular">${latest ? `${latest.weight} кг` : `${nut.targetWeight} кг`}</div>
                <div class="goal-sub">Цель: ${nut.targetWeight} кг${leftText ? ` · ${leftText}` : ''}</div>
              </div>
              ${pctGoal > 0 ? `<span class="goal-sub tabular" style="font-weight:700;color:var(--done);">${pctGoal}%</span>` : ''}
            </div>
            ${pctGoal > 0 ? `
              <div class="bar-track">
                <div class="bar-fill" style="width:${pctGoal}%"></div>

              <div><div class="macro-lbl">Ккал</div><div class="macro-val">${esc(nut.calories)}</div></div>
              <div><div class="macro-lbl">Белок</div><div class="macro-val">${esc(nut.protein)}</div></div>
              <div><div class="macro-lbl">Жиры</div><div class="macro-val">${esc(nut.fat)}</div></div>
              <div><div class="macro-lbl">Углев.</div><div class="macro-val">${esc(nut.carbs)}</div></div>
            </div>
          </div>
        </section>

        <section class="section-block">
          <div class="section-head">
            <h2 class="section-title">InBody</h2>
            <button class="text-link-btn" onclick="openAddInbodyModal()">+ Замер</button>
          </div>

          ${latest ? `
            <div class="metrics-grid">
              <div class="metric-box">
                <div class="metric-lbl">Вес</div>
                <div class="metric-val tabular">${latest.weight} кг</div>
                ${deltaHtml(latest.weight, first.weight, ' кг', true)}

              <div class="metric-box">
                <div class="metric-lbl">Жир</div>

              </div>
              <div class="metric-box">
                <div class="metric-lbl">Мышцы</div>
                <div class="metric-val tabular">${latest.muscleKg} кг</div>
                ${deltaHtml(latest.muscleKg, first.muscleKg, ' кг', false)}
              </div>
              <div class="metric-box">
                <div class="metric-lbl">Висц. жир</div>
                <div class="metric-val tabular">${latest.visceral}</div>

            ${sorted.length >= 2 ? renderInbodyChart(sorted) : ''}
          ` : `
            <div class="card" style="text-align:center;color:var(--text-muted);font-size:13px;">

          ${sorted.length ? `

                <div class="simple-row">

                  <button class="del-btn" onclick="deleteCardio('${c.id}')" title="Удалить">✕</button>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="card" style="text-align:center;color:var(--text-muted);font-size:13px;">
              Пока нет записей кардио.
            </div>
          `}
        </section>
      `;
    }

    function renderInbodyChart(data) {
      const w = 440, h = 150, padX = 28, padY = 20;
      const vals = data.flatMap(d => [d.weight, d.muscleKg, d.fatKg]);
      const minV = Math.floor(Math.min(...vals) - 3);
      const maxV = Math.ceil(Math.max(...vals) + 3);
      const rng = Math.max(1, maxV - minV);
      const xAt = i => padX + (data.length === 1 ? (w - padX * 2) / 2 : (i / (data.length - 1)) * (w - padX * 2));
      const yAt = v => padY + (h - padY * 2) - ((v - minV) / rng) * (h - padY * 2);

      const series = [
        { k: 'weight', lbl: 'Вес', c: '#6366f1' },
        { k: 'muscleKg', lbl: 'Мышцы', c: '#10b981' },
        { k: 'fatKg', lbl: 'Жир', c: '#f59e0b' }
      ];

      return `
        <div class="chart-card">
          <div class="chart-legend">
            ${series.map(s => `<span><i class="legend-dot" style="background:${s.c}"></i>${s.lbl}</span>`).join('')}
          </div>
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
            ${series.map(s => {
              const path = data.map((d, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(d[s.k]).toFixed(1)}`).join(' ');
              return `
                <path d="${path}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                ${data.map((d, i) => `
                  <circle cx="${xAt(i)}" cy="${yAt(d[s.k])}" r="3.8" fill="${s.c}"/>
                  <text x="${xAt(i)}" y="${yAt(d[s.k]) - 7}" text-anchor="middle" fill="${s.c}" font-size="10" font-weight="700">${d[s.k]}</text>
                `).join('')}
              `;
            }).join('')}
            ${data.map((d, i) => `
              <text x="${xAt(i)}" y="${h - 3}" text-anchor="middle" fill="var(--text-muted)" font-size="9.5">${fmtDate(d.date).slice(0, 5)}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="sheet">${html}</div>`;
      root.classList.remove('hidden');
      root.onclick = (e) => { if (e.target === root) closeModal(); };
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    function openConfirmModal(title, message, btnText, onConfirm) {
      window._confirmCb = () => {
        closeModal();

      openModal(`

        <div class="sheet-head">
          <h3 class="sheet-title">${esc(title)}</h3>
          <button class="icon-btn" style="width:32px;height:32px;" onclick="closeModal()">✕</button>

            <button class="primary-btn" style="background:var(--danger);color:#fff;" onclick="window._confirmCb()">${esc(btnText)}</button>

        </div>
      `);
    }

      openModal(`

            </div>
            <div class="form-grid-3">

              <div><label class="field-lbl">Отдых (с)</label><input id="f-rest" class="field-input" type="number" min="0" required value="${ex ? ex.restSec : 90}" /></div>
            </div>

              <label class="field-lbl">Основная мышца</label>
              <select id="f-muscle" class="field-input">
                ${Object.entries(MUSCLE_NAMES).map(([k, v]) => `<option value="${k}" ${(ex && ex.primary && ex.primary[0] === k) ? 'selected' : ''}>${v}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="field-lbl">Краткая подсказка (1–2 пункта через точку)</label>
              <input id="f-cue" class="field-input" value="${esc(ex && ex.cues ? ex.cues.join('. ') : '')}" placeholder="Сводите лопатки. Плавный возврат" />
            </div>
            <button type="submit" class="primary-btn">Сохранить</button>
          </form>
        </div>
      `);
    }

    function saveExerciseEdit(e, dayId, exId) {
      e.preventDefault();
      const day = state.days.find(d => d.id === dayId);
      if (!day) return;
      const name = document.getElementById('f-name').value.trim();
      const targetSets = Math.max(1, Number(document.getElementById('f-sets').value) || 3);
      const targetReps = document.getElementById('f-reps').value.trim();
      const restSec = Math.max(0, Number(document.getElementById('f-rest').value) || 0);
      const prim = document.getElementById('f-muscle').value;
      const cueRaw = document.getElementById('f-cue').value.trim();
      const cues = cueRaw ? cueRaw.split(/\.\s*/).filter(Boolean) : [];

      if (exId) {
        const ex = day.exercises.find(item => item.id === exId);
        if (ex) {
          ex.name = name;
          ex.targetSets = targetSets;
          ex.targetReps = targetReps;
          ex.restSec = restSec;
          ex.primary = [prim];
          if (cues.length) ex.cues = cues;
          while (ex.sets.length < targetSets) ex.sets.push({ id: uid('s'), weight: '', reps: '', done: false });
        }
      } else {
        day.exercises.push({
          id: uid('ex'), name, targetSets, targetReps, restSec,
          primary: [prim], secondary: [], diagram: 'lat_pulldown',
          cues: cues.length ? cues : ['Выполняйте подконтрольно без рывков.'],
          sets: makeSets(targetSets)
        });
      }
      saveState();
      renderMain();
      openProgramEditorModal(dayId);
      showToast('Сохранено');
    }

      closeModal();
      renderMain();
      showToast('Кардио записано');
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fitlog-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('JSON скачан');
    }

    function importJson(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.days)) throw new Error();
          state = parsed;
          if (!state.customPhotos) state.customPhotos = {};
          saveState();
          applyTheme();
          renderNav();
          renderMain();
          closeModal();
          showToast('Данные импортированы');
        } catch {
          showToast('Неверный формат JSON');
        }
      };
      r.readAsText(file);
    }

    function confirmReset() {
      openConfirmModal(
        'Сбросить все данные?',
        'Вся история тренировок, свои фото и добавленные замеры будут заменены стартовой программой.',
        'Сбросить',
        () => {
          state = getDefaultState();
          expandedExId = null;
          saveState();
          applyTheme();
          renderNav();
          renderMain();
          showToast('Стартовые данные восстановлены');
        }
      );
    }

    function confirmCleanStart() {
      openConfirmModal(
        'Начать с чистого листа?',
        'Личные замеры InBody, история тренировок и кардио будут очищены. Удобно, если дневником начинает пользоваться другой человек.',
        'Очистить',
        () => {
          state = getCleanUserState();
          expandedExId = null;
          saveState();
          applyTheme();
          renderNav();
          renderMain();
          showToast('Чистый профиль готов');
        }
      );
    }

    function copyShareCleanLink() {
      const url = `${window.location.origin}${window.location.pathname}?new=1`;
      if (copyTextToClipboard(url)) {
        showToast('Чистая ссылка скопирована!');
      } else {
        showToast('Ссылка: ' + url);
      }
    }

    /* =========================================================================
       9.1 ГЕНЕРАТОР ЕЖЕМЕСЯЧНОГО ОТЧЁТА ДЛЯ AI-ТРЕНЕРА
       ========================================================================= */
    function generateAICoachReport(daysBack = 30) {
      const now = new Date();
      const cutoff = daysBack > 0 ? new Date(now.getTime() - daysBack * 86400000) : null;
      const inRange = (iso) => {
        if (!cutoff || !iso) return true;
        return new Date(iso) >= cutoff;
      };

      const sessions = state.history.filter(h => inRange(h.date));
      const cardioList = state.cardio.filter(c => inRange(c.date));
      const sortedInbody = [...state.inbody].sort((a, b) => a.date.localeCompare(b.date));

      const exMap = {};
      state.days.forEach(d => d.exercises.forEach(e => { exMap[e.id] = e.name; }));

      const lines = [];
      lines.push(`=== ОТЧЁТ FITLOG (${daysBack > 0 ? `за последние ${daysBack} дн.` : 'за всё время'}) ===`);
      lines.push(`Дата: ${fmtDate(todayISO())}`);
      lines.push(`Тренировок завершено: ${sessions.length} | Кардио-сессий: ${cardioList.length}`);
      lines.push('');

      // 1. Питание
      const n = state.nutrition;
      lines.push(`--- ПИТАНИЕ И ЦЕЛЬ ---`);
      lines.push(`Целевой вес: ${n.targetWeight} кг | Ккал: ${n.calories} | Б: ${n.protein} | Ж: ${n.fat} | У: ${n.carbs}`);
      lines.push('');

      // 2. Силовая динамика по упражнениям
      lines.push(`--- СИЛОВЫЕ ПОКАЗАТЕЛИ ---`);
      if (!sessions.length) {
        lines.push('За этот период ещё нет завершённых тренировок (нажми «Завершить и сохранить тренировку» после зала).');
      } else {
        const stats = {};
        let totalTonnage = 0;
        sessions.forEach(s => {
          Object.entries(s.exercises || {}).forEach(([exId, sets]) => {
            if (!stats[exId]) stats[exId] = { name: exMap[exId] || exId, first: null, last: null, best1RM: 0, count: 0 };
            stats[exId].count++;
            const summary = sets.map(st => st.weight ? `${st.weight}×${st.reps || '?'}` : `${st.reps || '?'}`).join(', ');
            if (!stats[exId].first) stats[exId].first = `${fmtDate(s.date).slice(0,5)}: ${summary}`;
            stats[exId].last = `${fmtDate(s.date).slice(0,5)}: ${summary}`;
            sets.forEach(st => {
              const w = parseNum(st.weight);
              const r = parseNum(st.reps);
              if (!isNaN(w) && w > 0 && !isNaN(r) && r > 0) {
                totalTonnage += w * r;
                const rm = calc1RM(w, r);
                if (rm > stats[exId].best1RM) stats[exId].best1RM = rm;
              }
            });
          });
        });

        if (totalTonnage > 0) lines.push(`Общий тоннаж: ${Math.round(totalTonnage)} кг`);
        Object.values(stats).forEach(st => {
          const rmTxt = st.best1RM > 0 ? ` (1ПМ ~${st.best1RM} кг)` : '';
          if (st.count > 1) {
            lines.push(`• ${st.name}${rmTxt}: было [${st.first}] → стало [${st.last}]`);
          } else {
            lines.push(`• ${st.name}${rmTxt}: [${st.last}]`);
          }
        });
      }
      lines.push('');

      // 3. InBody
      lines.push(`--- INBODY ---`);
      if (!sortedInbody.length) {
        lines.push('Замеров пока нет.');
      } else {
        sortedInbody.slice(-3).forEach(m => {
          lines.push(`• ${fmtDate(m.date)}: Вес ${m.weight} кг | Жир ${m.fatKg} кг (${m.fatPct}%) | Мышцы ${m.muscleKg} кг | Висц. ${m.visceral} | Руки Л ${m.leftArm}/П ${m.rightArm}`);
        });
      }

      // 4. Кардио
      if (cardioList.length) {
        lines.push('');
        lines.push(`--- КАРДИО ---`);
        cardioList.slice(0, 8).forEach(c => {
          lines.push(`• ${fmtDate(c.date)}: ${c.type} — ${c.duration} мин${c.hr ? `, пульс ${c.hr}` : ''}${c.note ? ` (${c.note})` : ''}`);
        });
      }

      lines.push('');
      lines.push('Проанализируй мой прогресс, скажи где стоит добавить веса, нужно ли скорректировать программу или КБЖУ.');
      return lines.join('\n');
    }

    function openAICoachReportModal(daysBack = 30) {
      const report = generateAICoachReport(daysBack);
      openModal(`
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h3 class="sheet-title">Отчёт для AI-тренера</h3>
          <button class="icon-btn" style="width:32px;height:32px;" onclick="closeModal()">✕</button>
        </div>
        <div class="sheet-body">
          <div class="seg-3" style="grid-template-columns:1fr 1fr;">
            <button class="${daysBack === 30 ? 'active' : ''}" onclick="openAICoachReportModal(30)">За 30 дней</button>
            <button class="${daysBack === 0 ? 'active' : ''}" onclick="openAICoachReportModal(0)">За всё время</button>
          </div>
          <textarea id="ai-report-text" class="report-area" readonly>${esc(report)}</textarea>
          <div class="form-grid-2">
            <button class="primary-btn" onclick="copyAIReport()">Скопировать для чата</button>
            <button class="secondary-btn" style="height:48px;" onclick="exportJson()">Скачать JSON</button>
          </div>
        </div>
      `);
    }

    function copyAIReport() {
      const el = document.getElementById('ai-report-text');
      if (!el) return;
      if (copyTextToClipboard(el.value)) {
        showToast('Отчёт скопирован — вставляй в чат!');
      } else {
        el.select();
        showToast('Выдели и скопируй текст вручную');
      }
    }

    /* =========================================================================
       10. ИНИЦИАЛИЗАЦИЯ
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      renderNav();
      renderMain();
    });
  </script>

  <!-- Регистрация Service Worker для офлайн-режима -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
