              <label class="block text-xs font-semibold text-slate-500 mb-1">Дата замера</label>
              <input id="f-inb-date" type="date" required value="${getTodayISO()}" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Вес (кг)</label>
              <input id="f-inb-weight" type="number" step="0.1" inputmode="decimal" required placeholder="91.0" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Жир (кг)</label>
              <input id="f-inb-fatkg" type="number" step="0.1" inputmode="decimal" required placeholder="24.2" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Жир (%)</label>
              <input id="f-inb-fatpct" type="number" step="0.1" inputmode="decimal" required placeholder="26.5" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Мышцы (кг)</label>
              <input id="f-inb-muscle" type="number" step="0.1" inputmode="decimal" required placeholder="38.5" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Висцеральный жир</label>
              <input id="f-inb-visc" type="number" inputmode="numeric" required placeholder="9" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Вода (л)</label>
              <input id="f-inb-water" type="number" step="0.1" inputmode="decimal" required placeholder="49.0" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Основной обмен (ккал)</label>
              <input id="f-inb-bmr" type="number" inputmode="numeric" required placeholder="1820" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Левая рука (кг)</label>
              <input id="f-inb-la" type="number" step="0.1" inputmode="decimal" required placeholder="3.8" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Правая рука (кг)</label>
              <input id="f-inb-ra" type="number" step="0.1" inputmode="decimal" required placeholder="3.9" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
          </div>

          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="h-11 px-4 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold">Отмена</button>
            <button type="submit" class="h-11 px-5 rounded-xl bg-indigo-600 text-white text-sm font-semibold shadow-glow-indigo">Добавить замер</button>
          </div>
        </form>
      `);
    }

    function saveInbodyForm(e) {
      e.preventDefault();
      state.inbody.push({
        id: generateId('inb'),
        date: document.getElementById('f-inb-date').value,
        weight: Number(document.getElementById('f-inb-weight').value),
        fatKg: Number(document.getElementById('f-inb-fatkg').value),
        fatPct: Number(document.getElementById('f-inb-fatpct').value),
        muscleKg: Number(document.getElementById('f-inb-muscle').value),
        visceral: Number(document.getElementById('f-inb-visc').value),
        waterL: Number(document.getElementById('f-inb-water').value),
        bmr: Number(document.getElementById('f-inb-bmr').value),
        leftArm: Number(document.getElementById('f-inb-la').value),
        rightArm: Number(document.getElementById('f-inb-ra').value)
      });
      saveState();
      closeModal();
      renderMain();
      showToast('Новый замер InBody добавлен!', 'success');
    }

    /* Модалка: Добавить кардио */
    function openAddCardioModal() {
      openModal(`
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <h3 class="font-bold text-base">Новая кардио-тренировка</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400">✕</button>
        </div>
        <form onsubmit="saveCardioModalForm(event)" class="p-5 space-y-3.5">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Дата</label>
              <input id="f-car-date" type="date" required value="${getTodayISO()}" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Вид кардио</label>
              <select id="f-car-type" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500">
                <option value="Ходьба в гору">Ходьба в гору</option>
                <option value="Эллипс">Эллипс</option>
                <option value="Гребля">Гребля</option>
                <option value="Велотренажёр">Велотренажёр</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Длительность (мин)</label>
              <input id="f-car-dur" type="number" inputmode="numeric" required placeholder="45" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Средний пульс</label>
              <input id="f-car-hr" type="number" inputmode="numeric" placeholder="132" class="w-full h-11 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Заметка о самочувствии</label>
            <input id="f-car-note" type="text" placeholder="Ровный темп, отличное самочувствие" class="w-full h-11 px-3.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium outline-none focus:border-indigo-500" />
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="h-11 px-4 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold">Отмена</button>
            <button type="submit" class="h-11 px-5 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Сохранить</button>
          </div>
        </form>
      `);
    }

    function saveCardioModalForm(e) {
      e.preventDefault();
      state.cardioLogs.unshift({
        id: generateId('cardio'),
        date: document.getElementById('f-car-date').value,
        type: document.getElementById('f-car-type').value,
        duration: Number(document.getElementById('f-car-dur').value),
        hr: document.getElementById('f-car-hr').value ? Number(document.getElementById('f-car-hr').value) : null,
        note: document.getElementById('f-car-note').value.trim()
      });
      saveState();
      closeModal();
      renderMain();
      showToast('Кардио-тренировка добавлена!', 'success');
    }

    /* Модалка: Настройки (Тема, Автотаймер, Экспорт/Импорт JSON, Сброс) */
    function openSettingsModal() {
      const t = state.settings.theme;
      openModal(`
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <h3 class="font-bold text-base">Настройки и данные</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400">✕</button>
        </div>
        <div class="p-5 space-y-5 overflow-y-auto">
          <!-- Тема оформления -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Тема оформления</label>
            <div class="grid grid-cols-3 gap-2">
              ${[
                { id: 'system', label: 'Системная' },
                { id: 'light', label: 'Светлая' },
                { id: 'dark', label: 'Тёмная' }
              ].map(opt => `
                <button onclick="setTheme('${opt.id}'); openSettingsModal();" class="h-11 rounded-xl text-xs font-semibold border transition ${t === opt.id ? 'bg-indigo-600 border-indigo-600 text-white shadow-glow-indigo' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200'}">
                  ${opt.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Поведение таймера -->
          <div class="space-y-2.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Таймер отдыха</label>
            <label class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 cursor-pointer">
              <span class="text-sm font-medium">Автозапуск после отметки подхода</span>
              <input type="checkbox" ${state.settings.autoStartTimer ? 'checked' : ''} onchange="state.settings.autoStartTimer = this.checked; saveState();" class="w-5 h-5 accent-indigo-600 rounded" />
            </label>
            <label class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 cursor-pointer">
              <span class="text-sm font-medium">Звук и вибрация по завершении</span>
              <input type="checkbox" ${state.settings.soundEnabled ? 'checked' : ''} onchange="state.settings.soundEnabled = this.checked; saveState(); updateTimerUI();" class="w-5 h-5 accent-indigo-600 rounded" />
            </label>
          </div>

          <!-- Экспорт и импорт JSON -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Перенос между устройствами (JSON)</label>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="exportJsonData()" class="h-11 px-3 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs sm:text-sm font-semibold active:scale-95 transition">⬇ Экспорт JSON</button>
              <label class="h-11 px-3 rounded-xl border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs sm:text-sm font-semibold flex items-center justify-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-95 transition">
                <span>⬆ Импорт JSON</span>
                <input type="file" accept="application/json,.json" onchange="importJsonData(event)" class="hidden" />
              </label>
            </div>
            <p class="text-[11px] text-slate-400 mt-1.5">Все данные сохраняются локально в браузере. Используйте JSON для резервной копии или переноса на ноутбук.</p>
          </div>

          <!-- Сброс к стартовым данным -->
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
            <button onclick="confirmResetAll()" class="w-full h-11 rounded-xl border border-rose-200 dark:border-rose-500/30 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10 text-xs sm:text-sm font-semibold transition">
              Сбросить к стартовым данным по умолчанию
            </button>
          </div>
        </div>
      `);
    }

    function exportJsonData() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fitlog-backup-${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Резервная копия JSON скачана', 'success');
      } catch (err) {
        showToast('Не удалось экспортировать файл', 'error');
      }
    }

    function importJsonData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.days) || !parsed.nutrition || !Array.isArray(parsed.inbody)) {
            throw new Error('Некорректная структура файла');
          }
          state = parsed;
          saveState();
          applyTheme();
          renderNavigation();
          renderMain();
          closeModal();
          showToast('Данные успешно импортированы!', 'success');
        } catch (err) {
          showToast('Ошибка импорта: неверный формат JSON', 'error');
        }
      };
      reader.readAsText(file);
    }

    function confirmResetAll() {
      openConfirmModal(
        'Сбросить все данные?',
        'Вся история тренировок, кастомные упражнения и добавленные замеры будут заменены стартовой программой по умолчанию.',
        'Сбросить всё',
        () => {
          state = createDefaultState();
          saveState();
          applyTheme();
          renderNavigation();
          renderMain();
          showToast('Стартовые данные восстановлены');
        }
      );
    }

    /* =========================================================================
       8. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      renderNavigation();
      renderMain();
      updateTimerUI();
    });
  </script>
</body>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</html>
